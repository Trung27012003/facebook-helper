name: Build Windows
on: workflow_dispatch
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[build]'
      - run: python -m playwright install chromium
      - run: python -m PyInstaller --noconfirm --windowed --onedir --name FacebookHelper --collect-all playwright --collect-all facebook_helper launcher.py
      - run: Copy-Item README.md dist/FacebookHelper/README.md
      - uses: actions/upload-artifact@v4
        with:
          name: FacebookHelper-Windows
          path: dist/FacebookHelper/
