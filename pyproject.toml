[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "facebook-helper-hr"
version = "0.11.0"
description = "Trợ lý tuyển dụng Facebook cho một người dùng"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.8,<7",
  "playwright>=1.49,<2",
  "platformdirs>=4,<5",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
build = ["pyinstaller>=6,<7"]

[project.scripts]
facebook-helper = "facebook_helper.__main__:main"

[tool.setuptools.packages.find]
include = ["facebook_helper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools.package-data]
facebook_helper = ["assets/**/*"]
